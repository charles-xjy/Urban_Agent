<svg width="680" height="800" viewBox="0 0 680 800" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Urban Agent 加入资料审核与补充审批后的流程图</title>
<desc>clarify→planner→计划审批→并发研究→资料审核(gap_eval)→补充审批→生成报告；补充审批通过则进入报告，否则回到并发研究再收集一轮，最多三轮。</desc>
<style>
  text { font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; }
  .t  { font-size:14px; fill:#2C2C2A; }
  .ts { font-size:12px; fill:#5F5E5A; }
  .th { font-size:14px; font-weight:500; fill:#2C2C2A; }
  .arr{ stroke:#888780; stroke-width:1.5; fill:none; }
  rect.gray   { fill:#F1EFE8; stroke:#5F5E5A; stroke-width:1.5; }
  rect.blue   { fill:#E6F1FB; stroke:#185FA5; stroke-width:1.5; }
  rect.teal   { fill:#E1F5EE; stroke:#0F6E56; stroke-width:1.5; }
  rect.purple { fill:#EEEDFE; stroke:#534AB7; stroke-width:1.5; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="800" fill="#FFFFFF"/>

<rect class="gray" x="280" y="20" width="120" height="30" rx="15"/>
<text class="th" x="340" y="39" text-anchor="middle">START</text>

<line class="arr" x1="340" y1="50" x2="340" y2="78" marker-end="url(#arrow)"/>

<rect class="gray" x="225" y="78" width="230" height="46" rx="8"/>
<text class="th" x="340" y="98" text-anchor="middle">clarify · 澄清需求</text>
<text class="ts" x="340" y="114" text-anchor="middle">缺信息时 interrupt 追问</text>

<line class="arr" x1="340" y1="124" x2="340" y2="152" marker-end="url(#arrow)"/>

<rect class="gray" x="225" y="152" width="230" height="46" rx="8"/>
<text class="th" x="340" y="172" text-anchor="middle">planner · 制定计划</text>
<text class="ts" x="340" y="188" text-anchor="middle">生成 2–4 个研究子任务</text>

<line class="arr" x1="340" y1="198" x2="340" y2="226" marker-end="url(#arrow)"/>

<rect class="purple" x="225" y="226" width="230" height="46" rx="8"/>
<text class="th" x="340" y="246" text-anchor="middle" fill="#3C3489">human_approval · 计划审批</text>
<text class="ts" x="340" y="262" text-anchor="middle" fill="#534AB7">interrupt：确认 / 修改计划</text>

<line class="arr" x1="340" y1="272" x2="340" y2="300" marker-end="url(#arrow)"/>

<rect class="blue" x="237" y="306" width="230" height="46" rx="8"/>
<rect class="blue" x="231" y="303" width="230" height="46" rx="8"/>
<rect class="blue" x="225" y="300" width="230" height="46" rx="8"/>
<text class="th" x="340" y="320" text-anchor="middle" fill="#0C447C">researcher × N · 并发研究</text>
<text class="ts" x="340" y="336" text-anchor="middle" fill="#185FA5">Send 派发，findings 累加</text>

<line class="arr" x1="340" y1="352" x2="340" y2="382" marker-end="url(#arrow)"/>

<rect class="teal" x="225" y="382" width="230" height="46" rx="8"/>
<text class="th" x="340" y="402" text-anchor="middle" fill="#085041">gap_eval · 资料审核　★新增</text>
<text class="ts" x="340" y="418" text-anchor="middle" fill="#0F6E56">模型判断证据是否充分</text>

<line class="arr" x1="340" y1="428" x2="340" y2="456" marker-end="url(#arrow)"/>

<rect class="teal" x="225" y="456" width="230" height="46" rx="8"/>
<text class="th" x="340" y="476" text-anchor="middle" fill="#085041">supplement_approval　★新增</text>
<text class="ts" x="340" y="492" text-anchor="middle" fill="#0F6E56">interrupt：用户审批补充</text>

<line class="arr" x1="340" y1="502" x2="340" y2="572" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="528" text-anchor="start">通过 →</text>
<text class="ts" x="350" y="544" text-anchor="start">生成报告</text>

<rect class="gray" x="225" y="572" width="230" height="46" rx="8"/>
<text class="th" x="340" y="592" text-anchor="middle">reporter · 生成报告</text>
<text class="ts" x="340" y="608" text-anchor="middle">仅基于已收集 findings</text>

<line class="arr" x1="340" y1="618" x2="340" y2="646" marker-end="url(#arrow)"/>
<rect class="gray" x="280" y="646" width="120" height="30" rx="15"/>
<text class="th" x="340" y="665" text-anchor="middle">END</text>

<path d="M225 479 L150 479 L150 323 L222 323" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text class="ts" x="142" y="392" text-anchor="end" fill="#0F6E56">需补充 ↑</text>
<text class="ts" x="142" y="408" text-anchor="end" fill="#0F6E56">Send×N</text>
<text class="ts" x="142" y="424" text-anchor="end" fill="#0F6E56">≤ 3 轮</text>

<rect class="purple" x="40" y="712" width="16" height="16" rx="4"/>
<text class="ts" x="62" y="724" text-anchor="start">用户审批 (interrupt)</text>
<rect class="teal" x="240" y="712" width="16" height="16" rx="4"/>
<text class="ts" x="262" y="724" text-anchor="start">本次新增节点</text>
<rect class="blue" x="410" y="712" width="16" height="16" rx="4"/>
<text class="ts" x="432" y="724" text-anchor="start">并发研究</text>
<rect class="gray" x="540" y="712" width="16" height="16" rx="4"/>
<text class="ts" x="562" y="724" text-anchor="start">普通节点</text>
</svg>
